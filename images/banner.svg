<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Temp File Share — upload, share, let it expire</title>
  <desc id="desc">Self-hosted temporary file sharing from your browser or terminal. A teal and warm cream repository banner with an upload-to-link illustration.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c211e"/><stop offset="1" stop-color="#153d35"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#69d1c2" stop-opacity=".2"/><stop offset="1" stop-color="#69d1c2" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f3e8dc"/></linearGradient>
  </defs>
  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <ellipse cx="1090" cy="55" rx="430" ry="390" fill="url(#glow)"/>
  <g fill="none" stroke="#a9dfd1" stroke-opacity=".09">
    <path d="M0 364H1280M0 324H1280M0 284H1280M0 244H1280"/>
    <path d="M880 0V440M960 0V440M1040 0V440M1120 0V440M1200 0V440"/>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="58" y="52" width="218" height="30" rx="15" fill="#bde9db" fill-opacity=".12" stroke="#bde9db" stroke-opacity=".25"/>
    <circle cx="76" cy="67" r="4" fill="#8ce0c6"/>
    <text x="91" y="72" font-size="12" fill="#bde9db" letter-spacing="2">SELF-HOSTED SHARING</text>
    <text x="56" y="154" font-size="61" font-weight="700" fill="#fffaf0" letter-spacing="-2">Temp File Share</text>
    <text x="60" y="205" font-size="28" fill="#92deca">Upload. Share. Let it expire.</text>
    <text x="60" y="255" font-size="18" fill="#c3d4cf">Browser or terminal. A link in seconds.</text>
    <text x="60" y="282" font-size="18" fill="#c3d4cf">Your server. Your storage. Automatic expiry.</text>
    <g font-size="13" fill="#dceae3">
      <rect x="60" y="328" width="113" height="34" rx="17" fill="#ffffff" fill-opacity=".07"/><text x="80" y="350">Web + CLI</text>
      <rect x="183" y="328" width="143" height="34" rx="17" fill="#ffffff" fill-opacity=".07"/><text x="203" y="350">Streamed transfers</text>
      <rect x="336" y="328" width="133" height="34" rx="17" fill="#ffffff" fill-opacity=".07"/><text x="356" y="350">Per-IP quotas</text>
    </g>
    <text x="60" y="405" font-size="13" fill="#86a89d">github.com/nooblk-98/temp-file-share</text>
    <rect x="738" y="71" width="474" height="292" rx="21" fill="#000000" fill-opacity=".12"/>
    <rect x="724" y="57" width="474" height="292" rx="21" fill="url(#card)"/>
    <circle cx="750" cy="81" r="5" fill="#c9b4a2"/><circle cx="767" cy="81" r="5" fill="#d4c6b6"/><circle cx="784" cy="81" r="5" fill="#94b9ac"/>
    <text x="1168" y="85" font-size="12" text-anchor="end" fill="#5b7469">FILE → LINK</text>
    <rect x="751" y="105" width="420" height="125" rx="13" fill="#ffffff" stroke="#c8d7ca" stroke-dasharray="6 5"/>
    <g transform="translate(774 123)" fill="none" stroke="#226d5b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0H28L40 12V65H0Z"/><path d="M28 0V12H40M20 47V24M11 33L20 24L29 33"/>
    </g>
    <text x="838" y="150" font-size="19" font-weight="600" fill="#173f33">project-notes.txt</text>
    <text x="838" y="177" font-size="14" fill="#66736c">Ready to share. Not here forever.</text>
    <rect x="838" y="192" width="305" height="7" rx="3.5" fill="#d8e7dc"/><rect x="838" y="192" width="305" height="7" rx="3.5" fill="#49957e"/>
    <rect x="751" y="247" width="420" height="72" rx="12" fill="#173f33"/>
    <text x="770" y="272" font-size="12" fill="#9ed0bc" letter-spacing="1">YOUR DOWNLOAD LINK</text>
    <text x="770" y="297" font-size="16" fill="#fffaf0" font-family="monospace">/download/…_project-notes.txt</text>
    <circle cx="1160" cy="359" r="32" fill="#9ee0c5"/>
    <g transform="translate(1147 346)" fill="none" stroke="#173f33" stroke-width="2.5" stroke-linecap="round"><circle cx="13" cy="13" r="12"/><path d="M13 6V13L19 16"/></g>
    <text x="1040" y="405" font-size="13" text-anchor="middle" fill="#bde1d1">Share the file. Skip the permanence.</text>
  </g>
</svg>
