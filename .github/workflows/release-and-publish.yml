name: Release and Publish

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      bump:
        description: Which part of the version to increment
        required: false
        default: patch
        type: string
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 -- work out which version this run publishes.
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags: the next version is derived from the tag list.
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            version="$RELEASE_TAG"
          else
            latest=$(git tag -l 'v*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n1 || true)
            latest="${latest:-v0.0.0}"
            core="${latest#v}"
            major="${core%%.*}"
            rest="${core#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::Unknown bump '$BUMP' (expected patch, minor or major)"; exit 1 ;;
            esac
            version="v${major}.${minor}.${patch}"
            echo "Latest tag $latest, bumping $BUMP -> $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Publishing \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Stage 2 -- tag the commit and open the GitHub release.
  # Skipped when the run was started by a release that already exists.
  # ---------------------------------------------------------------------------
  release:
    name: Tag and create release
    needs: version
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes --target "$GITHUB_SHA"

  # ---------------------------------------------------------------------------
  # Stage 3 -- build the multi-arch image and push it to GHCR.
  # `always()` is required because the release job is skipped on release events,
  # and a skipped dependency would otherwise skip this job too.
  # ---------------------------------------------------------------------------
  publish:
    name: Build and push image
    needs: [version, release]
    if: >-
      always()
      && needs.version.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name != 'release' || !github.event.release.prerelease }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Stage 4 -- rewrite the release body with generated notes.
  # Runs last on purpose: the release already carries GitHub's generated notes,
  # so a hiccup here must not block publishing the image.
  # ---------------------------------------------------------------------------
  release-notes:
    name: Generate release notes
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and update release notes
        uses: nooblk-98/copilot-release-notes-action@v1.1.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          copilot_model: gpt-4o
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.event.release.target_commitish || github.sha }}
