name: Release and Publish

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      bump:
        description: Which part of the version to increment
        required: false
        default: patch
        type: string
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 -- work out which version this run publishes.
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    # Manual runs are only allowed from main; release events carry their own tag ref.
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the next version is derived from the tag list.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::Release tag is not a valid version (expected vMAJOR.MINOR.PATCH[-prerelease])"
              exit 1
            fi
            version="$RELEASE_TAG"
          else
            latest=$(git tag -l 'v*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n1 || true)
            latest="${latest:-v0.0.0}"
            core="${latest#v}"
            major="${core%%.*}"
            rest="${core#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::Unknown bump '$BUMP' (expected patch, minor or major)"; exit 1 ;;
            esac
            version="v${major}.${minor}.${patch}"
            echo "Latest tag $latest, bumping $BUMP -> $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Publishing \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Stage 2 -- tag the commit and open the GitHub release.
  # Skipped when the run was started by a release that already exists.
  # ---------------------------------------------------------------------------
  release:
    name: Tag and create release
    needs: version
    if: github.event_name != 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Credentials stay persisted on purpose: the next step pushes the tag.
      - name: Checkout  # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes --target "$GITHUB_SHA"

  # ---------------------------------------------------------------------------
  # Stage 3 -- build the multi-arch image and push it to GHCR.
  # `always()` is required because the release job is skipped on release events,
  # and a skipped dependency would otherwise skip this job too.
  # ---------------------------------------------------------------------------
  publish:
    name: Build and push image
    needs: [version, release]
    if: >-
      !cancelled()
      && (github.ref == 'refs/heads/main' || github.event_name == 'release')
      && needs.version.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name != 'release' || !github.event.release.prerelease }}

      # Best-effort pre-push gate: scans a local amd64 build BEFORE anything is
      # pushed. It is a separate build from the pushed one, so the authoritative
      # check is the per-platform scan of the pushed digest in `scan-pushed`
      # (which must pass before the image is signed).
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          load: true
          push: false
          tags: temp-file-share:scan
          cache-from: type=gha,scope=release

      - name: Trivy gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: temp-file-share:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

  # ---------------------------------------------------------------------------
  # Stage 3b -- scan the pushed digest for every platform. Must pass before the
  # image is signed or the release notes are rewritten.
  # ---------------------------------------------------------------------------
  scan-pushed:
    name: Scan pushed image (${{ matrix.platform }})
    needs: publish
    # Explicit result check: a skipped `release` job upstream (release events)
    # would otherwise skip this job via the implicit success() check.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Trivy scan of pushed digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

  # ---------------------------------------------------------------------------
  # Stage 3c -- sign the pushed digest with cosign (keyless, GitHub OIDC).
  # id-token: write lives only on this job. Verify with:
  #   cosign verify ghcr.io/nooblk-98/temp-file-share@<digest> \
  #     --certificate-identity-regexp '^https://github\.com/nooblk-98/temp-file-share/\.github/workflows/release-and-publish\.yml@refs/(heads/main|tags/v.+)$' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  # ---------------------------------------------------------------------------
  sign:
    name: Sign image
    needs: [publish, scan-pushed]
    if: ${{ !cancelled() && needs.scan-pushed.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # ---------------------------------------------------------------------------
  # Stage 4 -- rewrite the release body with generated notes.
  # Runs last on purpose: the release already carries GitHub's generated notes,
  # so a hiccup here must not block publishing the image.
  # ---------------------------------------------------------------------------
  release-notes:
    name: Generate release notes
    needs: [version, publish, scan-pushed]
    if: ${{ !cancelled() && needs.scan-pushed.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate and update release notes
        uses: nooblk-98/copilot-release-notes-action@ce64182ece97ff8e7392755797f06db072d50878 # v1.1.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          copilot_model: gpt-4o
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.event.release.target_commitish || github.sha }}
