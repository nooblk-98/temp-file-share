name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main]
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r app/requirements.txt ruff==0.17.4
      - run: ruff check app tests
      - run: python -m compileall -q app tests
      - run: python -m unittest discover -s tests -v
      - run: bash -n app/scripts/upload.sh

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: docker build -t temp-file-share:test app
      - run: bash .github/scripts/smoke-test.sh temp-file-share:test
      - run: python3 .github/scripts/compose-smoke.py temp-file-share:test

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
        env:
          PYTHON: python
