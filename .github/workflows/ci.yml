name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          # Correctness rules only (pyflakes + pycodestyle errors); style rules
          # are not enforced yet.
          version: "0.17.1"
          args: check --select E4,E7,E9,F app

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Check shell syntax
        run: bash -n .github/scripts/smoke-test.sh app/scripts/upload.sh

      - name: Byte-compile
        run: python -m compileall -q app

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile

  image:
    name: Build, smoke test and scan image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          load: true
          push: false
          tags: temp-file-share:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh temp-file-share:ci 34101

      - name: Trivy scan (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: temp-file-share:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
