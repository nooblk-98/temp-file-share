name: Deploy development to Portainer

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portainer-development
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/development'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Redeploy development stack
    needs: verify
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Portainer webhook
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_DEVELOPMENT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::error::PORTAINER_DEVELOPMENT_WEBHOOK_URL is not configured"
            exit 1
          fi
          # Do not print the credential-bearing URL or Portainer response.
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 --request POST "$WEBHOOK_URL"
          echo "Portainer accepted the development deployment webhook."
