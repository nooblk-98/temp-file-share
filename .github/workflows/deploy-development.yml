name: Deploy development to Portainer

on:
  workflow_call:
    secrets:
      WEBHOOK_URL:
        required: true

permissions: {}

concurrency:
  group: portainer-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger Portainer after image publication
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::error::The development stack webhook is not configured"
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 --request POST "$WEBHOOK_URL"
          echo "Portainer accepted the development deployment webhook."
