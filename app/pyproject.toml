[project]
name = "temp-file-share"
version = "2.1.0"
description = "Upload files and folders from your terminal and get a download link."
requires-python = ">=3.11"
dependencies = ["python-multipart==0.0.33"]

[tool.ty]
python-version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I"]
